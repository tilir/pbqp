name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }} / Clang 21
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            cxx_flags: ""
            build_type: Release
            sanitizer_flags: ""
            shared_libs: "ON"
            docs: "ON"
          - name: Release libc++
            cxx_flags: -stdlib=libc++
            build_type: Release
            sanitizer_flags: ""
            shared_libs: "OFF"
            docs: "OFF"
          - name: ASan + UBSan
            cxx_flags: ""
            build_type: Debug
            sanitizer_flags: -fsanitize=address,undefined -fno-omit-frame-pointer
            shared_libs: "OFF"
            docs: "OFF"
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang 21 and build tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor > "$RUNNER_TEMP/llvm-keyring.gpg"
          sudo install -m 0644 "$RUNNER_TEMP/llvm-keyring.gpg" /usr/share/keyrings/llvm.gpg
          echo 'deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-21 clang-tools-21 clang-format-21 libclang-rt-21-dev \
            libc++-21-dev libc++abi-21-dev cmake ninja-build libtbb-dev python3 doxygen
          clang++-21 --version
          clang-format-21 --version
          cmake --version

      - name: Set up Ruby
        if: matrix.shared_libs == 'ON'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Check Ruby and Fiddle
        if: matrix.shared_libs == 'ON'
        run: |
          ruby --version
          ruby -rfiddle/import -e 'puts "Fiddle available"'

      - name: Configure
        run: >-
          cmake -G Ninja -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_SHARED_LIBS=${{ matrix.shared_libs }}
          -DPBQP_BUILD_EXAMPLES=ON
          -DPBQP_BUILD_DOCS=${{ matrix.docs }}
          -DCMAKE_C_COMPILER=clang-21
          -DCMAKE_CXX_COMPILER=clang++-21
          -DCMAKE_C_FLAGS="${{ matrix.sanitizer_flags }}"
          -DCMAKE_CXX_FLAGS="${{ matrix.sanitizer_flags }} ${{ matrix.cxx_flags }}"

      - name: Check formatting
        if: matrix.build_type == 'Release'
        run: cmake --build build --target check-format

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

      - name: Generate API reference
        if: matrix.docs == 'ON'
        run: cmake --build build --target docs

      - name: Upload API reference
        if: matrix.docs == 'ON'
        uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: build/docs/html
          if-no-files-found: error
